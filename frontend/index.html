<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TranslaTHOR</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel upload-panel" aria-labelledby="pageTitle">
        <h1 id="pageTitle">TranslaTHOR</h1>
        <p class="sub">Translate PDFs locally while preserving their structure and figures.</p>

        <label id="dropzone" class="dropzone" for="fileInput">
          <input
            id="fileInput"
            class="visually-hidden"
            type="file"
            accept="application/pdf,.pdf"
            multiple
          />
          <span class="dropzone-title">Drop PDF files here</span>
          <span class="dropzone-hint">or</span>
          <span class="button-like" aria-hidden="true">Choose PDF files</span>
          <span class="dropzone-note">Files start automatically using the recommended local settings.</span>
        </label>

        <p id="appStatus" class="app-status" role="status" aria-live="polite">Loading jobs…</p>
      </section>

      <section class="panel activity-panel" aria-labelledby="activityHeading">
        <div class="section-heading">
          <h2 id="activityHeading">Current activity</h2>
        </div>
        <div id="currentActivity" aria-live="polite" aria-busy="false">
          <p class="empty-state">Checking for active work…</p>
        </div>
      </section>

      <section class="panel waiting-panel" aria-labelledby="waitingHeading">
        <div class="section-heading">
          <h2 id="waitingHeading">Waiting <span id="waitingCount" class="count-badge">0</span></h2>
        </div>
        <div id="waitingQueue">
          <p class="empty-state">No documents are waiting.</p>
        </div>
      </section>

      <section class="panel results-panel" aria-labelledby="resultsHeading">
        <div class="section-heading results-heading">
          <h2 id="resultsHeading">Recent results</h2>
          <div class="section-actions">
            <button
              id="showExcludedBtn"
              class="quiet-button"
              type="button"
              aria-pressed="false"
              hidden
            >Show excluded</button>
            <details id="managePanel" class="manage-menu">
              <summary>Manage</summary>
              <div class="manage-actions">
                <p>These actions affect more than one document.</p>
                <button id="cleanTerminalBtn" class="secondary-button" type="button">
                  Delete failed and stopped jobs
                </button>
                <button id="stopAllBtn" class="danger-button" type="button">
                  Stop active and waiting jobs
                </button>
                <button id="clearResultsBtn" class="danger-button" type="button">
                  Delete all jobs and files
                </button>
              </div>
            </details>
          </div>
        </div>
        <div id="recentResults">
          <p class="empty-state">No completed documents yet.</p>
        </div>
        <div id="excludedResults" class="excluded-results" hidden></div>
      </section>
    </main>

    <script src="/app.js?v=20260715-ui" defer></script>
  </body>
</html>
