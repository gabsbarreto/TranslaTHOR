<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local PDF Translator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel upload-panel">
        <h1>PDF Translation Workbench</h1>
        <p class="sub">Upload a PDF, select an OCR engine, and translate with the local Qwen model.</p>

        <div id="dropzone" class="dropzone">
          <input id="fileInput" type="file" accept="application/pdf" multiple hidden />
          <p>Drag and drop PDF files here</p>
          <button id="pickBtn" type="button">Select Files</button>
        </div>

        <div class="settings-grid">
          <label>OCR Engine
            <select id="ocrEngine">
              <option value="surya2_llamacpp" selected>Surya 2 + llama.cpp (experimental)</option>
              <option value="surya_qwen_mlx">Surya + Qwen (mlx-vlm)</option>
              <option value="marker_surya">Surya + Marker</option>
            </select>
          </label>
          <label>Extraction Mode
            <select id="extractionMode">
              <option value="auto" selected>Auto</option>
              <option value="digital">Digital only</option>
              <option value="scanned">Scanned / OCR</option>
              <option value="strip_and_force_ocr">Force OCR + strip existing OCR</option>
              <option value="auto_repair">Auto + local VLM repair</option>
            </select>
          </label>
          <label>Chunk Tokens <input id="chunkSize" type="number" min="128" max="8000" value="1800" /></label>
          <label>LLM Temperature <input id="temp" type="number" min="0" max="1" step="0.05" value="0.4" /></label>
          <label>LLM Max Tokens <input id="maxTokens" type="number" min="256" max="8192" value="2048" /></label>
          <label>Translation LLM
            <select id="model">
              <option value="mlx-community/Qwen3.5-9B-MLX-4bit" selected>Qwen3.5-9B-MLX-4bit</option>
            </select>
          </label>
          <label>LLM Top P <input id="topP" type="number" min="0" max="1" step="0.05" value="0.7" /></label>
        </div>
        <div class="checks">
          <label><input id="useLocalVlmRepair" type="checkbox" /> Local VLM repair</label>
          <label><input id="keepDebugArtifacts" type="checkbox" /> Keep debug artifacts</label>
        </div>
      </section>

      <section class="panel marker-progress-panel">
        <div class="queue-head">
          <h2>Automated Extraction / Translation</h2>
        </div>
        <ol id="workflowSteps" class="workflow-steps">
          <li data-step="upload">Upload</li>
          <li data-step="select">Detect PDF type</li>
          <li data-step="ocr">OCR / document structure</li>
          <li data-step="translate">Translate</li>
          <li data-step="export">Export</li>
        </ol>
        <p id="workflowStatus" class="sub">No active document.</p>
      </section>

      <section class="panel queue-panel">
        <div class="queue-head">
          <h2>Document Queue</h2>
          <div class="queue-actions">
            <button id="cleanTerminalBtn" class="secondary-button" type="button">Clean Cancelled/Failed</button>
            <button id="stopAllBtn" class="danger-button" type="button">Stop All Processes</button>
            <button id="clearResultsBtn" class="danger-button" type="button">Clean Results</button>
          </div>
        </div>
        <div id="queue"></div>
      </section>
    </main>

    <script src="/app.js?v=20260724-surya2" defer></script>
  </body>
</html>
